# HyprpmPlugins.conf   (Ziel: /usr/share/TrafkTux/HyprpmPlugins.conf)
#
# Welche hyprpm-Repos TrafkTux haben will. Eine Quelle fuer beide Seiten:
#   - ISO.sh (Schritt 1/5) baut die Plugins fuer die ISO daraus
#   - HyprpmSync.sh baut sie auf dem installierten System neu auf
#
# Format (eine Zeile pro Repo):
#   <Repo-URL> <Plugin> [<Plugin> ...]
#
# Hinter der URL stehen die Plugin-Namen, die per "hyprpm enable" aktiviert
# werden. Baut ein Repo auf der laufenden Hyprland-Version nicht (oder laesst
# sich eines seiner Plugins nicht aktivieren), wird das ganze Repo entfernt.

https://github.com/hyprwm/hyprland-plugins        hyprbars hyprfocus
https://github.com/sandwichfarm/hyprexpo          hyprexpo
https://github.com/hyprnux/hyprglass              hyprglass
https://github.com/virtcode/hypr-dynamic-cursors  dynamic-cursors
https://github.com/horriblename/hyprgrass         hyprgrass
https://github.com/savonovv/hypr-kinetic-scroll   hypr-kinetic-scroll
https://github.com/gen3vra/hyprwinwrap            hyprwinwrap
