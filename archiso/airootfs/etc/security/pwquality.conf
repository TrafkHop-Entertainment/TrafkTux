# /etc/security/pwquality.conf
#
# TrafkTux Passwort-Policy - fest eingebaut, bewusst NICHT ueber ein
# Widget konfigurierbar (User-Entscheidung).
#
# Mindestens 12 Zeichen, mindestens 3 der 4 Zeichenklassen
# (Grossbuchstaben, Kleinbuchstaben, Ziffern, Sonderzeichen) - "3 der
# 4" statt starr "Buchstaben+Zahlen+Zeichen", weil pwquality Gross-
# und Kleinbuchstaben technisch als zwei eigene Klassen zaehlt. Mit
# minclass=3 reicht z.B. "kleinbuchstaben+zahl+sonderzeichen" genauso
# wie "gross+klein+zahl" - erfuellt inhaltlich exakt die geforderten
# "3 Arten", ohne Gross-/Kleinschreibung separat zu erzwingen.

minlen = 12
minclass = 3

# Auch fuer root gilt die Policy (relevant falls root ueberhaupt ein
# eigenes Passwort bekommt, siehe Hinweis zu Calamares unten).
enforce_for_root

# Wie oft der User bei einem abgelehnten Passwort erneut gefragt wird,
# bevor der ganze Vorgang abbricht (reine Komfort-Einstellung, keine
# Sicherheitsauswirkung).
retry = 3
