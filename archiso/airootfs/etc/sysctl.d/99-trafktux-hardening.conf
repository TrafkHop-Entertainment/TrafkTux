# /etc/sysctl.d/99-trafktux-hardening.conf
#
# TrafkTux Security-Haertung - besprochen und Punkt-fuer-Punkt
# durchgegangen. Bewusst NICHT drin: fs.protected_symlinks (User-
# Entscheidung, nicht vergessen falls das nochmal aufkommt).

# --- Kernel-Info-Leakage ---
# Versteckt Kernel-Pointer aus /proc vor normalen Usern (erschwert
# Exploits die auf Speicheradressen angewiesen sind).
kernel.kptr_restrict = 2

# Versteckt den Kernel-Log-Ringbuffer (dmesg) vor normalen Usern -
# nur noch mit sudo/root lesbar.
kernel.dmesg_restrict = 1

# Nur direkte Eltern-Kind-Prozesse duerfen sich gegenseitig per
# ptrace anhaengen (Wert 1 = Ubuntu-Standard-Kompromiss, nicht 2/3,
# damit normales Debugging/Profiling nicht komplett blockiert wird).
kernel.yama.ptrace_scope = 1

# ASLR explizit auf volle Staerke festnageln (ist auf Arch eh schon
# Standard, hier nur zur Sicherheit fest verankert falls irgendein
# Paket/Tool das mal runtersetzt).
kernel.randomize_va_space = 2

# --- Netzwerk-Haertung ---
# Reverse Path Filtering (strict) - schuetzt gegen IP-Spoofing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN-Cookies - Schutz gegen SYN-Flood/DoS.
net.ipv4.tcp_syncookies = 1

# ICMP-Redirects nicht annehmen - schuetzt gegen MITM-Angriffe im
# lokalen Netz (z.B. Hotel-/Gaeste-WLAN).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Selbst keine ICMP-Redirects verschicken (nur relevant falls der
# Rechner mal als Gateway/Router fuer andere Geraete dient).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Source-Routing ablehnen - alte, heute kaum noch legitim genutzte
# IP-Option, die fuer Spoofing/Routing-Angriffe missbraucht werden
# kann.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- Dateisystem-Schutz ---
# (fs.protected_symlinks bewusst NICHT gesetzt - User-Entscheidung)

# Hardlinks: normale User duerfen keine Hardlinks auf Dateien
# anlegen, auf die sie eigentlich keinen Schreibzugriff haben
# (z.B. setuid-Binaries).
fs.protected_hardlinks = 1

# FIFOs/reguläre Dateien in world-writable+sticky Verzeichnissen
# (z.B. /tmp) - Stufe 2 ist von den Kernel-Entwicklern selbst als
# sinnvollster Wert empfohlen, schuetzt vor Race-Condition-Tricks
# beim Schreiben.
fs.protected_fifos = 2
fs.protected_regular = 2
