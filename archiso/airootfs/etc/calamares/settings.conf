---
modules-search: [ local ]

instances:
- id:       bootkernel
  module:   shellprocess
  config:   shellprocess-bootkernel.conf
- id:       pacmansync
  module:   shellprocess
  config:   shellprocess-pacmansync.conf
- id:       fixboot
  module:   shellprocess
  config:   shellprocess-fixboot.conf
- id:       cleanup
  module:   shellprocess
  config:   shellprocess-cleanup.conf
- id:       aurinstall
  module:   shellprocess
  config:   shellprocess-aurinstall.conf
- id:       hyprpminstall
  module:   shellprocess
  config:   shellprocess-hyprpminstall.conf
- id:       ydotool
  module:   shellprocess
  config:   shellprocess-ydotool.conf
- id:       avahi
  module:   shellprocess
  config:   shellprocess-avahi.conf
- id:       liveshortcutcleanup
  module:   shellprocess
  config:   shellprocess-liveshortcutcleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@bootkernel
  - shellprocess@pacmansync
  - shellprocess@fixboot
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpiocfg
  - initcpio
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@ydotool
  - shellprocess@aurinstall
  - shellprocess@hyprpminstall
  - shellprocess@avahi
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
  - shellprocess@liveshortcutcleanup
- show:
  - finished

branding: trafktux

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
