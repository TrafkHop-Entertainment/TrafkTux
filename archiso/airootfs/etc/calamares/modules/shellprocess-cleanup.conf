---
dontChroot: false
timeout: 300
script:
  - rm -f /etc/sudoers.d/99-liveuser
  - rm -f /etc/polkit-1/rules.d/60-trafktux-calamares.rules
  - rm -f /usr/share/applications/calamares.desktop
  - rm -f /etc/pacman.d/hooks/liveuser.hook
  - rm -f /usr/local/bin/create-liveuser.sh

  # Grosses Build-Repo samt Datenbank entfernen. Die dort installierten Pakete
  # bleiben installiert (pamac-all, hyprshade, ...) und werden danach ueber
  # das AUR aktualisiert. Das winzige /opt/TrafkTuxOptional bleibt bewusst
  # liegen: Pamac braucht es fuer die Optional-Metapakete.
  - rm -rf /opt/trafktux-repo
  - rm -f /var/lib/pacman/sync/trafktux.db /var/lib/pacman/sync/trafktux.files

  # Pacman-Keyring fuer das Zielsystem initialisieren (liegt nicht in der
  # airootfs.sfs, sondern wird im Live-System erst beim Boot erzeugt).
  # Ohne das scheitert spaeter jedes pacman -S aus core/extra an der
  # Signaturpruefung. Danach gpg-Agenten beenden, sonst bleibt das Ziel
  # beim Aushaengen "busy".
  - pacman-key --init
  - pacman-key --populate archlinux
  - gpgconf --homedir /etc/pacman.d/gnupg --kill all || true

  # Sicherheitsnetz: initcpiocfg/initcpio und bootloader/grubcfg liefen
  # bereits (mit den durch shellprocess@fixboot reparierten Dateien).
  # Ein zusaetzlicher, idempotenter Rebuild hier schadet nicht und faengt
  # Faelle ab, in denen z.B. aurinstall zwischenzeitlich neue Kernel-Module
  # (nvidia-dkms) nachinstalliert hat, die ein frisches Initramfs brauchen.
  - mkinitcpio -P
  - grub-mkconfig -o /boot/grub/grub.cfg

# Diese Dateien sind NUR fuer die Live-Session gedacht (passwortloser
# liveuser). Ohne diesen Schritt haette der spaeter angelegte, echte
# Benutzer dauerhaft passwortlosen sudo- und polkit-Zugriff auf dem
# fertig installierten System. Falls du das absichtlich WILLST (z.B.
# bewusst ein bequemes Ein-Personen-System), einfach diese Datei leeren.
