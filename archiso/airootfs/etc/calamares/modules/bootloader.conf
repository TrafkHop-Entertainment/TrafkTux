---
# BUGFIX (siehe Chat): fehlte komplett - ohne diese Angabe landet Calamares'
# bootloader-Modul (main.py, prepare_bootloader()) bei BIOS-Installationen
# im "else: pass"-Zweig, OHNE die Variable efi_boot_loader je zu setzen,
# und crasht direkt danach mit "UnboundLocalError: cannot access local
# variable 'efi_boot_loader'". "grub" passt zu euren grubInstall/grubMkconfig/
# grubCfg/grubProbe-Einstellungen weiter unten.
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
