---
services:
  - name: NetworkManager
    mandatory: true
  - name: sddm
    mandatory: true
  - name: bluetooth
    mandatory: false
  - name: cups
    mandatory: false
  - name: cups-browsed
    mandatory: false
  - name: avahi-daemon
    mandatory: false
  - name: keyd
    mandatory: false
  - name: ufw
    mandatory: false
  - name: systemd-resolved
    mandatory: false
  - name: tailscaled
    mandatory: false
  - name: clamav-freshclam
    mandatory: false
  # power-profiles-daemon war hier nie gelistet, weil dessen Paket
  # den Dienst über ein systemd-Preset selbst aktiviert hat. tuned
  # und tuned-ppd tun das NICHT automatisch - beide müssen explizit
  # rein, sonst bleibt der Energy-Profile-Tab im Widget leer/"nicht
  # gefunden", obwohl die Pakete installiert sind. Beide werden hier
  # explizit enabled (ob tuned-ppd tuned zuverlässig automatisch
  # mitstartet, hängt vom Bus-Activation-Verhalten ab - sicherer,
  # beide direkt über systemd zu aktivieren).
  - name: tuned
    mandatory: false
  - name: tuned-ppd
    mandatory: false

targets:
  - name: multi-user
    mandatory: true
