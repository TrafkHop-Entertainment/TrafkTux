---
defaultGroups:
  - wheel
  - seat
  - video
  - audio
  - input
  - storage
  - optical
  - network
  - power
  - rfkill
  - lp
  - i2c

autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
passwordRequirements:
  minLength: 0
  libpwquality:
    - minlen=0
    - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true

userShell: /bin/bash
