---
# Spielt die auf dem Build-Host gecachten Pacman-Sync-Datenbanken
# (airootfs/opt/trafktux-pacman-sync-cache/*.db, siehe Begruendung in
# ISO.sh Schritt 2/5) ins Zielsystem zurueck.
#
# WICHTIG, im Gegensatz zu bootkernel: dontChroot: false (Default) ist
# hier richtig! Anders als der Kernel (der nur auf der ISO9660-Ebene
# liegt, s. shellprocess-bootkernel.conf) ist /opt/trafktux-pacman-sync-
# cache ein ganz normaler Pfad INNERHALB des squashfs-Roots - unpackfs hat
# ihn also schon 1:1 mit ins Zielsystem kopiert, bevor dieser Job laeuft,
# und ist damit auch innerhalb des chroot ganz normal erreichbar.
#
# OHNE diesen Schritt (laeuft VOR aurinstall, siehe settings.conf):
# "pacman -S" in install-aur-packages.sh bricht mit "error: failed to
# prepare transaction (could not find database)" ab, weil mkarchiso die
# echten Sync-Datenbanken IMMER aus der Live-ISO entfernt (siehe
# ISO.sh-Kommentar fuer den per Quellcode verifizierten Grund).
#
# Keine eigenen Bash-Variablen/Command-Substitutionen hier (siehe
# ausfuehrliche Begruendung in shellprocess-bootkernel.conf) - Calamares'
# Macro-Expander wuerde den ganzen Job sonst mit "missing variables"
# abbrechen.
dontChroot: false
timeout: 30
script:
  - mkdir -p /var/lib/pacman/sync
  - find /opt/trafktux-pacman-sync-cache -maxdepth 1 -type f -name "*.db" -exec cp -a {} /var/lib/pacman/sync/ \;
