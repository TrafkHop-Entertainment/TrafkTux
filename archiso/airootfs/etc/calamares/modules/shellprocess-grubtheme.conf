---
# Kopiert das GRUB-Theme von /opt/trafktux-grub-theme (siehe ISO.sh Schritt
# 4/5, "GRUB-Theme nach /opt staged") zurueck nach /boot/grub/themes/trafktux
# auf dem ZIELSYSTEM.
#
# WARUM UEBERHAUPT NOETIG: mkarchiso loescht airootfs/boot KOMPLETT beim
# ISO-Bau (siehe mkarchiso, _cleanup_pacstrap_dir() - "Delete all files in
# /boot"), unabhaengig davon, was customize_airootfs.sh vorher dort hin-
# kopiert hat. airootfs/boot/grub/themes/trafktux/ (unser Theme im Repo)
# UEBERLEBT diese Bereinigung also nie bis in die fertige squashfs/ISO - das
# ist normales archiso-Verhalten, kein Bug in diesem Profil. ISO.sh legt
# deswegen zusaetzlich eine Kopie unter /opt/trafktux-grub-theme an (/opt/
# wird von der Bereinigung NICHT angefasst) - dieser Schritt hier holt sie
# auf dem Zielsystem (dessen /boot ECHT ist und bleibt) wieder zurueck.
#
# dontChroot: false (Default) ist hier richtig: /opt/trafktux-grub-theme ist
# ein ganz normaler Pfad INNERHALB des squashfs-Roots - unpackfs hat ihn also
# schon 1:1 ins Zielsystem kopiert, bevor dieser Job laeuft, genau wie bei
# shellprocess@pacmansync.
#
# Laeuft bewusst VOR grubcfg/bootloader (siehe settings.conf) - nicht weil
# grub-mkconfig die Datei zum Generieren bräuchte (GRUB_THEME wird einfach
# unconditional in die grub.cfg geschrieben), sondern damit die Theme-Dateien
# spaetestens beim ersten echten Boot garantiert vorhanden sind.
#
# trafktux-grub-theme-sync.sh (laeuft als eigener systemd-Service bei jedem
# Boot) bleibt dadurch komplett unveraendert - es sieht auf dem Zielsystem
# exakt dasselbe /boot/grub/themes/trafktux/ wie bisher, nur eben erst ab
# hier ueberhaupt vorhanden.
#
# Keine eigenen Bash-Variablen/Command-Substitutionen (siehe ausfuehrliche
# Begruendung in shellprocess-bootkernel.conf) - Calamares' Macro-Expander
# wuerde den ganzen Job sonst mit "missing variables" abbrechen.
# "-" vor JEDEM Befehl (siehe shellprocess-avahi.conf fuer dasselbe Muster):
# macht jede einzelne Zeile non-fatal, falls /opt/trafktux-grub-theme
# ausnahmsweise fehlt (z.B. ISO ohne Theme gebaut, siehe ISO.sh-HINWEIS) -
# "cp -a" schlaegt dann zwar fehl, aber ohne "-" wuerde das die GESAMTE
# Installation abbrechen (Calamares stoppt beim ersten fehlschlagenden Job
# komplett), nur wegen einer rein kosmetischen Datei. mkdir/rm sind ohnehin
# idempotent/unkritisch.
dontChroot: false
timeout: 30
script:
  - "-mkdir -p /boot/grub/themes"
  - "-rm -rf /boot/grub/themes/trafktux"
  - "-cp -a /opt/trafktux-grub-theme /boot/grub/themes/trafktux"
