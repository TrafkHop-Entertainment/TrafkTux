---
# WICHTIG, im Gegensatz zu fixboot/cleanup: dontChroot: true!
#
# Dieser Schritt MUSS im LIVE-Kontext laufen, nicht im chroot des
# Zielsystems. Der Kernel liegt naemlich ueberhaupt nicht im Zielsystem -
# unpackfs hat gerade ein komplett LEERES /boot aufs Ziel kopiert (siehe
# Begruendung unten) - sondern nur auf der gemounteten ISO selbst
# (/run/archiso/bootmnt). Diese ISO ist im chroot des Zielsystems gar
# nicht sichtbar: der "mount"-Job von Calamares (laeuft vor unpackfs)
# bindet dort nur /dev, /proc, ein FRISCHES leeres /run-tmpfs, /run/udev
# und /sys ein - keine verschachtelten Mounts wie /run/archiso/bootmnt.
# Mit dontChroot: true laufen die Befehle stattdessen im Live-System
# (wo /run/archiso/bootmnt erreichbar ist), und ${ROOT} wird von
# Calamares automatisch auf den Mountpunkt des Zielsystems ersetzt
# (z.B. /tmp/calamares-root-xxxxx) - siehe shellprocess.conf-Doku im
# Calamares-Quellcode.
#
# WARUM /boot UEBERHAUPT LEER ANKOMMT (per mkarchiso-Quellcode
# verifiziert, nicht geraten - siehe mkarchiso, Funktionen
# _cleanup_pacstrap_dir() und _copy_boot_out_of_pacstrap_dir()):
#   # Delete all files in /boot
#   [[ -d "${pacstrap_dir}/boot" ]] && _unshare find "${pacstrap_dir}/boot" -mindepth 1 -delete
# mkarchiso kopiert Kernel, Initramfs und Microcode-Images beim ISO-Bau
# IMMER zuerst raus nach iso/arch/boot/... (fuers Booten direkt von der
# ISO9660/FAT-Partition, unabhaengig von der squashfs), und LOESCHT sie
# danach aus der airootfs selbst. Die squashfs (= das, was ihr gerade
# live bootet und was unpackfs 1:1 aufs Zielsystem kopiert) hat deshalb
# NIE einen Kernel in /boot - das ist normales, beabsichtigtes
# archiso-Verhalten, kein Fehler in eurem Profil.
#
# Ohne diesen Schritt hier findet das direkt danach laufende Calamares-
# Modul initcpiocfg/initcpio (mkinitcpio -p linux) kein
# /boot/vmlinuz-linux und die Installation bricht ab ("Invalid option -k
# -- '/boot/vmlinuz-linux' must be readable").
#
# Pfad /run/archiso/bootmnt/arch/boot/... ist kein Rateversuch: "arch"
# kommt direkt aus profiledef.sh's install_dir (siehe auch der
# source-Pfad in unpackfs.conf: ".../arch/x86_64/airootfs.sfs"), und das
# Layout darunter (${install_dir}/boot/${arch}/vmlinuz-... fuer Kernel +
# Initramfs, ${install_dir}/boot/*-ucode.img fuer Microcode) steht exakt
# so in mkarchiso's _make_boot_on_iso9660().
#
# WICHTIG: In diesen Befehlen KEINE eigenen Bash-Variablen/
# Command-Substitutionen ($(...), $var) verwenden! Calamares' eigener
# Macro-Expander (siehe StringExpander.cpp/CommandList.cpp) ersetzt
# JEDES "$..." im Script selbst, bevor ueberhaupt eine Shell beteiligt
# ist - taucht da ein nicht registriertes $irgendwas auf (alles ausser
# ${ROOT}, ${USER}, ${LANG}, gs[...]), bricht der GESAMTE Job sofort mit
# "Could not run command - missing variables" ab. Deshalb hier bewusst
# nur "find ... -exec ... {} \;" ohne jedes "$" im eigenen Bash-Sinn.
dontChroot: true
timeout: 30
script:
  - find /run/archiso/bootmnt/arch/boot/x86_64 -maxdepth 1 -type f -name "vmlinuz-linux" -exec cp -a {} ${ROOT}/boot/vmlinuz-linux \;
  - find /run/archiso/bootmnt/arch/boot -maxdepth 1 -type f -name "*-ucode.img" -exec cp -a {} ${ROOT}/boot/ \;
  - test -r ${ROOT}/boot/vmlinuz-linux
