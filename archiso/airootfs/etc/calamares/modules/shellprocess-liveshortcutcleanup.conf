---
# Entfernt die beiden von LiveInstallerShortcut.sh beim Live-Boot
# angelegten Dateien (Desktop-Icon + Launcher/Anwendungsmenue-Eintrag fuer
# "TrafkTux installieren") wieder aus dem Home-Verzeichnis von liveuser -
# NACHDEM die Installation erfolgreich war. Siehe LiveInstallerShortcut.sh
# fuer die ausfuehrliche Begruendung.
#
# dontChroot: true ist hier WICHTIG und richtig: dieser Job soll auf dem
# LIVE-System (wo liveuser lebt) aufraeumen, nicht im chroot des gerade
# installierten Zielsystems (${ROOT}) - genau umgekehrter Fall zu
# shellprocess-pacmansync.conf.
#
# Calamares bricht seine exec-Sequenz beim ersten fehlschlagenden Job ab -
# dieser Job steht daher bewusst GANZ AM ENDE der Sequenz (nach bootloader/
# cleanup/umount, siehe settings.conf). Laeuft er, war alles davor schon
# erfolgreich.
#
# Fest verdrahteter Pfad "/home/liveuser/..." statt ${ROOT}/${USER}:
# liveuser ist in archiso IMMER der Name des Live-Benutzers (archiso-
# Standard, nicht TrafkTux-spezifisch) - ${USER} waere hier ohnehin der
# neu angelegte Zielsystem-Benutzername (z.B. "raubo"), nicht liveuser.
#
# Keine eigenen Bash-Variablen/Command-Substitutionen (siehe ausfuehrliche
# Begruendung in shellprocess-bootkernel.conf).
dontChroot: true
timeout: 10
script:
  - rm -f /home/liveuser/Desktop/trafktux-installer.desktop
  - rm -f /home/liveuser/.local/share/applications/trafktux-installer.desktop
