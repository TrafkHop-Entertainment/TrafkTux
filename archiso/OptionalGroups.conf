# OptionalGroups.conf
# Definition der optionalen Metapakete (Repo: TrafkTuxOptional).
# Wird von BuildOptionalRepo.sh gelesen. Eine Aenderung hier = Skript neu laufen
# lassen = neue ISO bauen.
#
# Format:
#   [Gruppe]                  -> Paketname: TrafkTuxOptional-<Gruppe>
#   Description = ...         -> Beschreibung in Pamac (eine Zeile, ohne Anfuehrungszeichen)
#   Packages    = a b c       -> Pakete. Das Skript sortiert selbst:
#                                  in den Arch-Repos      -> "depends" (Pamac zeigt sie an)
#                                  nur im AUR             -> Queue (OptionalSync.sh baut sie)
#                                  nirgends               -> Build bricht mit Fehler ab
#   Flatpaks    = id1 id2     -> Flatpak-IDs von Flathub (werden von OptionalSync.sh installiert)
#   Services    = x.service   -> wird im .install per "systemctl enable --now" aktiviert
#   ModulesLoad = sg          -> Kernelmodul: modules-load.d-Datei + modprobe
#   Groups      = libvirt     -> der Benutzer wird per pkexec zur Gruppe hinzugefuegt
#   Name        = Paketname   -> optional, ueberschreibt TrafkTuxOptional-<Gruppe>
#   Update      = fast|fastfull|full -> startet SystemUpdate.sh (siehe unten)
#   PkgUrls     = https://... -> fertiges .pkg.tar.zst, wird geladen und per pkexec pacman -U installiert
#
# Nicht enthalten (kein Paket moeglich): DaVinci Resolve (manueller Download).
# libreoffice-fresh stand nur in der alten Work-Liste und ist bewusst nicht drin.

[Social]
Description = Social-Apps (Discord)
Packages    = discord

[MultiMedia]
Description = Multimedia: qBittorrent, MakeMKV, Asunder, HandBrake
Packages    = qbittorrent makemkv makemkv-libaacs asunder handbrake
ModulesLoad = sg

[Work]
Description = Arbeit und Kreatives: Obsidian, OBS, Audacity, OnlyOffice, JetBrains, GeoGebra, LMMS
Packages    = obsidian jetbrains-toolbox audacity obs-studio obs-pipewire-audio-capture-bin qalculate-gtk geogebra-6-bin onlyoffice-bin lmms

[GameLaunchers]
Description = Spiele-Launcher: Steam, itch.io, Heroic
Packages    = steam itch-bin heroic-games-launcher-bin

[Games]
Description = Spiele: Prism Launcher, OpenTTD, SuperTuxKart, Sober, Vinegar und mehr
Packages    = prismlauncher hytale-launcher-bin bedrock-on-linux-bin openttd supertuxkart cubyz-bin airshipper srb2 srb2kart
Flatpaks    = org.vinegarhq.Sober org.vinegarhq.Vinegar

[Emulators]
Description = Emulatoren: Dolphin, mGBA, PPSSPP, RPCS3, PCSX2, Cemu, Xemu und mehr
Packages    = stella bigpemu-bin xemu xenia-edge-bin azaharplus-appimage 3beans-git parallel-launcher cemu mesen bsnes-hd melonds vita3k-bin rpcs3-bin pcsx2-latest-bin duckstation-preview-latest-bin shadps4-qtlauncher-bin kega-fusion flycast-bin vbam-wx dolphin-emu mgba-qt ppsspp

[Virtualisation]
Description = Virtualisierung: QEMU, libvirt, virt-manager
Packages    = virt-manager qemu-full libvirt dnsmasq
Services    = libvirtd.service
Groups      = libvirt

[AndroidMirroring]
Description = Android spiegeln: scrcpy, adb
Packages    = scrcpy android-tools

[Learning]
Description = Lernumgebung: Docker (z.B. fuer OWASP Juice Shop)
Packages    = docker
Services    = docker.service

# --- Einzel-Apps ("Other") ---

[BambuStudio]
Description = Bambu Studio (3D-Druck-Slicer)
Packages    = bambustudio-bin

[Ladybird]
Description = Ladybird Browser
Packages    = ladybird

[Docker]
Description = Docker und Docker Desktop
Packages    = docker docker-desktop
Services    = docker.service

[OpenTabletDriver]
Description = OpenTabletDriver (Grafiktablett-Treiber)
Packages    = opentabletdriver

[Webcamoid]
Description = Webcamoid (Webcam-App)
Packages    = webcamoid

[Timeshift]
Description = Timeshift (System-Snapshots)
Packages    = timeshift

[Archiso]
Description = Archiso (eigene Arch-ISOs bauen)
Packages    = archiso

[TheClicker]
Description = TheClicker (Autoclicker)
Packages    = theclicker
Groups      = input

[LsfgVk]
Description = lsfg-vk (Lossless Scaling Frame Generation fuer Vulkan)
Packages    = lsfg-vk-bin

[Mega]
Description = MEGA Sync (Download direkt von mega.nz)
PkgUrls     = https://mega.nz/linux/repo/Arch_Extra/x86_64/megasync-x86_64.pkg.tar.zst

# --- Systemupdate (holt das TrafkTux-Repo und kopiert die Dateien ins System) ---
# Installieren = einmal ausfuehren. Zum erneuten Ausfuehren das Paket in Pamac
# neu installieren (oder: bash /usr/local/lib/trafktux/SystemUpdate.sh [--fast] [--full]).
#   Fast      = --fast          ohne Icon-/Theme-Dumps
#   FastFull  = --fast --full   ohne Icon-/Theme-Dumps, MIT Grub/Plymouth/Boot
#   Full      = --full          alles, MIT Grub/Plymouth/Boot

[UpdateFast]
Name        = TrafkTuxUpdate-Fast
Description = TrafkTux Systemupdate (schnell): Configs ohne Icon- und Theme-Ordner
Update      = fast

[UpdateFastFull]
Name        = TrafkTuxUpdate-FastFull
Description = TrafkTux Systemupdate (schnell + Boot): ohne Icons/Themes, mit Grub/Plymouth, baut Initramfs neu
Update      = fastfull

[UpdateFull]
Name        = TrafkTuxUpdate-Full
Description = TrafkTux Systemupdate (komplett): alles inklusive Icons, Themes, Grub/Plymouth, baut Initramfs neu
Update      = full
